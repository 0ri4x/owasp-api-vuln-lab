# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# WARNING: Intentionally weak JWT secret (VULNERABILITY: API8-Weak Authentication)
app.jwt.secret=secret123
# Unreasonably long token validity (VULNERABILITY: API8)
app.jwt.ttl-seconds=2592000

# Expose error details (VULNERABILITY: API7-Security Misconfiguration)
server.error.include-message=always
server.error.include-stacktrace=always

# SECURITY FIX: Rate limiting configuration
# Redis configuration for distributed rate limiting (fallback to in-memory if Redis unavailable)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0

# SECURITY FIX: Rate limiting settings
app.ratelimit.auth.requests-per-minute=5
app.ratelimit.auth.requests-per-hour=20
app.ratelimit.financial.requests-per-minute=3
app.ratelimit.financial.requests-per-hour=10
app.ratelimit.admin.requests-per-minute=10
app.ratelimit.admin.requests-per-hour=50
app.ratelimit.data.requests-per-minute=30
app.ratelimit.data.requests-per-hour=200
app.ratelimit.general.requests-per-minute=60
app.ratelimit.general.requests-per-hour=1000

logging.level.root=INFO
# SECURITY FIX: Enhanced security logging
logging.level.edu.nu.owaspapivulnlab=DEBUG
