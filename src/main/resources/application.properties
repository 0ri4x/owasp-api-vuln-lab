# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# SECURITY FIX: Strong JWT configuration with environment variable support
# Use environment variable JWT_SECRET_KEY or fallback to secure default
app.jwt.secret=${JWT_SECRET_KEY:aVeryStrongSecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmSecurity!@#$%^&*()_+}
# SECURITY FIX: Short token validity for security (15 minutes)
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
# SECURITY FIX: Refresh token validity (7 days)
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
# SECURITY FIX: JWT issuer and audience for validation
app.jwt.issuer=${JWT_ISSUER:owasp-api-vuln-lab}
app.jwt.audience=${JWT_AUDIENCE:owasp-api-users}

# SECURITY FIX: Secure error handling configuration
# Production-safe error exposure (no sensitive details to clients)
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:never}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING:never}
server.error.include-exception=${ERROR_INCLUDE_EXCEPTION:false}

# SECURITY FIX: Custom error path for security
server.error.path=/api/error

# SECURITY FIX: Rate limiting configuration
# Redis configuration for distributed rate limiting (fallback to in-memory if Redis unavailable)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0

# SECURITY FIX: Rate limiting settings
app.ratelimit.auth.requests-per-minute=5
app.ratelimit.auth.requests-per-hour=20
app.ratelimit.financial.requests-per-minute=3
app.ratelimit.financial.requests-per-hour=10
app.ratelimit.admin.requests-per-minute=10
app.ratelimit.admin.requests-per-hour=50
app.ratelimit.data.requests-per-minute=30
app.ratelimit.data.requests-per-hour=200
app.ratelimit.general.requests-per-minute=60
app.ratelimit.general.requests-per-hour=1000

logging.level.root=INFO
# SECURITY FIX: Enhanced security logging configuration
logging.level.edu.nu.owaspapivulnlab=DEBUG
logging.level.SECURITY=INFO
logging.level.AUDIT=INFO
logging.level.ERROR=ERROR

# SECURITY FIX: Structured logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{eventType:-}] [%X{eventId:-}] [%X{username:-}] [%X{ipAddress:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{eventType:-}] [%X{eventId:-}] [%X{username:-}] [%X{ipAddress:-}] %logger{36} - %msg%n

# SECURITY FIX: Separate log files for different event types
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
